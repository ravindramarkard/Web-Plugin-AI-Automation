name: Run Test Cases

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'What to test'
        required: true
        type: choice
        options:
          - suite
          - project
          - test_case
          - all
      suite_id:
        description: 'Test Suite ID (if scope is suite)'
        required: false
        type: string
      project_id:
        description: 'Project ID (if scope is project)'
        required: false
        type: string
      test_case_id:
        description: 'Test Case ID (if scope is test_case)'
        required: false
        type: string
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - main
      - develop

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      # Optional: If you need a database service
      # postgres:
      #   image: postgres:15
      #   env:
      #     POSTGRES_PASSWORD: postgres
      #   options: >-
      #     --health-cmd pg_isready
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start API Server
        run: |
          cd server
          pnpm install
          pnpm dev &
          echo $! > /tmp/api-server.pid
          sleep 5
        env:
          PORT: 3001

      - name: Run Tests
        run: |
          chmod +x scripts/run-tests.js
          
          if [ "${{ github.event.inputs.test_scope }}" == "suite" ]; then
            node scripts/run-tests.js --suite "${{ github.event.inputs.suite_id }}" --update-results --headless
          elif [ "${{ github.event.inputs.test_scope }}" == "project" ]; then
            node scripts/run-tests.js --project "${{ github.event.inputs.project_id }}" --update-results --headless
          elif [ "${{ github.event.inputs.test_scope }}" == "test_case" ]; then
            node scripts/run-tests.js --test-case "${{ github.event.inputs.test_case_id }}" --update-results --headless
          else
            node scripts/run-tests.js --all --update-results --headless
          fi
        env:
          API_URL: http://localhost:3001/api

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Files
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-files
          path: tests/
          retention-days: 7

      - name: Stop API Server
        if: always()
        run: |
          if [ -f /tmp/api-server.pid ]; then
            kill $(cat /tmp/api-server.pid) || true
          fi

